[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snipforge"
version = "0.11.0"
description = "Open-source SnagIt-style screenshot and markup tool for Windows"
readme = "README.md"
license = "MIT"
authors = [{ name = "nighthawk909" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.12",
    "PySide6-Addons>=6.12",  # video: Qt 6.12's FFmpeg 9 is what snipforge/video/ffmpeg.py is written for
    "pillow>=12",  # video: GIF export
    "pywin32>=306; sys_platform == 'win32'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2.0; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/nighthawk909/snipforge"
Issues = "https://github.com/nighthawk909/snipforge/issues"
Changelog = "https://github.com/nighthawk909/snipforge/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14", "pyinstaller>=6.10", "cyclonedx-bom>=7"]

[project.gui-scripts]
snipforge = "snipforge.app:main"

[tool.setuptools.packages.find]
include = ["snipforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "desktop: drives real Windows features (windows, share sheet, hook); run with -m desktop",
    "windows: needs Windows itself (registry, Explorer, Win32); skipped on other platforms",
    "mac: needs macOS itself (AppKit, Quartz, Vision); skipped on other platforms",
    "stress: long runs that look for rare failures (hundreds of recordings); run with -m stress",
]
addopts = "-m 'not desktop and not stress'"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["packaging/*.spec"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    "S603", "S607",  # subprocess with fixed args (explorer, taskkill) is intentional
    "S101",          # asserts are fine in tests
    "S110", "S112",  # try/except/pass is deliberate around flaky shell extensions; each is commented
    "B008",
]

[tool.ruff.lint.isort]
# The scripts' sibling modules: "build" is also the name of a PyPI package, installed on some machines
# and not others, so without this the import order would depend on the machine.
known-first-party = ["snipforge", "build", "universal"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E731"]
# Inline SVG artwork and Qt style sheets read better unwrapped.
"snipforge/icons.py" = ["E501"]
"snipforge/editor/stamps.py" = ["E501"]
"snipforge/editor/window.py" = ["E501"]
