name: Release

# On every push to main, release-please keeps an open "release PR" that bumps the version and
# updates CHANGELOG.md from conventional commits. Merging that PR creates the tag and GitHub
# release; this workflow then builds, self-tests and attaches the installer.
# Run it by hand ("Run workflow", with a tag) to rebuild and re-attach assets for an existing release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach assets to (e.g. v0.4.0)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Workflows on a bot-opened release PR wait for approval ("action_required"). Approve them so
      # CI runs as a normal PR check, which the "Protect main" ruleset requires before merging.
      - name: Approve CI on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Raw JSON, parsed below: step env is evaluated even when the step is skipped, and
          # `pr` is empty on most runs, so fromJSON() here would fail the workflow.
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // empty' 2>/dev/null || true)
          if [ -z "$BRANCH" ]; then
            echo "No release PR on this run."
            exit 0
          fi
          for attempt in $(seq 1 12); do
            ids=$(gh run list --repo "$GITHUB_REPOSITORY" --branch "$BRANCH" --event pull_request \
                    --status action_required --json databaseId --jq '.[].databaseId')
            if [ -n "$ids" ]; then
              for id in $ids; do
                gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve" && echo "approved run $id"
              done
              exit 0
            fi
            sleep 10
          done
          echo "::warning::No release-PR runs were waiting for approval; approve them from the Actions tab if CI is missing."

  build:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, build]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snipforge-windows
          path: dist
      - name: Build provenance
        # Artifact attestations are free for public repositories.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SnipForge-*-setup.exe
            dist/SnipForge-*-portable.zip
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/SnipForge-*-setup.exe dist/SnipForge-*-portable.zip \
            dist/SHA256SUMS.txt dist/sbom.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
