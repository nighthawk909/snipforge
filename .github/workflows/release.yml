name: Release

# On every push to main, release-please keeps an open "release PR" that bumps the version and
# updates CHANGELOG.md from conventional commits. Merging that PR creates the tag and a *draft*
# GitHub release; this workflow then builds, self-tests and attaches the installer, and only then
# publishes the release, so the "latest" download links never point at a release without its files.
# If the build fails the release stays a draft (only maintainers see it) and the previous release
# stays "Latest". Run it by hand ("Run workflow", with a tag) to rebuild and re-attach assets for an
# existing release; a draft is published once its files are attached.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, published or draft, to build and attach assets to (e.g. v0.4.0)"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # gh talks to github.com unless told otherwise; on GitHub Enterprise it needs this server.
      - name: Point gh at this server
        run: echo "GH_HOST=${GITHUB_SERVER_URL#https://}" >> "$GITHUB_ENV"
      # Workflows on a bot-opened release PR wait for approval ("action_required"). Approve them so
      # CI runs as a normal PR check, which the "Protect main" ruleset requires before merging.
      - name: Approve CI on the release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          # Raw JSON, parsed below: step env is evaluated even when the step is skipped, and
          # `pr` is empty on most runs, so fromJSON() here would fail the workflow.
          PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          NUMBER=$(printf '%s' "$PR_JSON" | jq -r '.number // empty' 2>/dev/null || true)
          if [ -z "$NUMBER" ]; then
            echo "No release PR on this run."
            exit 0
          fi
          BRANCH=$(printf '%s' "$PR_JSON" | jq -r '.headBranchName // empty' 2>/dev/null || true)
          if [ -z "$BRANCH" ]; then
            echo "::warning::release-please didn't name release PR #$NUMBER's branch; approve its CI from the Actions tab."
            exit 0
          fi
          # release-please reuses one branch for every release PR, so only runs for the branch's current
          # commit are its own; runs left waiting by earlier release PRs stay as they are. Read the
          # commit from the branch: for a few seconds after release-please updates an existing PR,
          # GitHub still reports the PR's previous commit.
          if ! SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha); then
            echo "::warning::Couldn't read branch $BRANCH; approve release PR #$NUMBER's CI from the Actions tab."
            exit 0
          fi
          approved=0
          for attempt in $(seq 1 12); do
            ids=$(gh run list --repo "$GITHUB_REPOSITORY" --commit "$SHA" --event pull_request \
                    --status action_required --json databaseId --jq '.[].databaseId')
            # The PR's workflows can start a few seconds apart: stop once a check finds no more.
            if [ -z "$ids" ] && [ "$approved" -gt 0 ]; then
              exit 0
            fi
            for id in $ids; do
              if gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; then
                echo "approved run $id"
                approved=$((approved + 1))
              else
                echo "::warning::Couldn't approve run $id; approve it from the Actions tab."
              fi
            done
            sleep 10
          done
          if [ "$approved" -eq 0 ]; then
            echo "::warning::No runs for the release PR's commit $SHA were waiting for approval; approve them from the Actions tab if CI is missing."
          fi

  build:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write  # code signing: build.yml signs only commits that are on main
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
      sign: true

  # Every release carries the Mac version too (docs/CROSS-PLATFORM.md): built, installed and
  # self-tested from the same tag, and the release is only published if it passes.
  mac:
    needs: release-please
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || needs.release-please.outputs.release_created == 'true') }}
    uses: ./.github/workflows/mac.yml
    permissions:
      contents: read
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}

  publish:
    needs: [release-please, build, mac]
    if: ${{ always() && needs.build.result == 'success' && needs.mac.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      # gh talks to github.com unless told otherwise; on GitHub Enterprise it needs this server.
      - name: Point gh at this server
        run: echo "GH_HOST=${GITHUB_SERVER_URL#https://}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snipforge-windows
          path: dist
      # SnipForge-setup.exe is the same installer without the version in its name, so
      # <server>/<repo>/releases/latest/download/SnipForge-setup.exe always serves the
      # newest stable release. The in-app updater looks for the versioned name. scripts/build.py
      # makes the copy; tags built before it existed (re-run by hand) get it here.
      - name: Version-less installer for the permanent download link
        run: |
          if [ ! -f dist/SnipForge-setup.exe ]; then
            cp dist/SnipForge-*-setup.exe dist/SnipForge-setup.exe
            (cd dist && sha256sum SnipForge-setup.exe >> SHA256SUMS.txt)
          fi
          # [[:space:]]* also matches the CR of the CRLF lines build.py writes on Windows.
          grep -qE '  SnipForge-setup\.exe[[:space:]]*$' dist/SHA256SUMS.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snipforge-macos
          path: dist-mac
      # The Mac .dmg, plus SnipForge.dmg: the same file without the version, so
      # <server>/<repo>/releases/latest/download/SnipForge.dmg is a permanent Mac download link.
      # The in-app updater looks for the versioned name.
      - name: Add the Mac version
        run: |
          dmg=$(ls dist-mac/SnipForge-*.dmg)
          [ "$(echo "$dmg" | wc -l)" -eq 1 ] || { echo "::error::Expected one .dmg, found: $dmg"; exit 1; }
          cp "$dmg" dist/
          cp "$dmg" dist/SnipForge.dmg
          (cd dist && sha256sum "$(basename "$dmg")" SnipForge.dmg >> SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - name: Build provenance
        # Artifact attestations are free for public repositories.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SnipForge-*-setup.exe
            dist/SnipForge-setup.exe
            dist/SnipForge-*-portable.zip
            dist/SnipForge-*.dmg
            dist/SnipForge.dmg
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" dist/SnipForge-*-setup.exe dist/SnipForge-setup.exe \
            dist/SnipForge-*-portable.zip dist/SnipForge-*.dmg dist/SnipForge.dmg \
            dist/SHA256SUMS.txt dist/sbom.cdx.json \
            --clobber --repo "$GITHUB_REPOSITORY"
      # release-please creates the release as a draft (release-please-config.json), so people, the
      # download links and the in-app updater only see it now that every file is attached.
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
        run: |
          draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          if [ "$draft" != "true" ]; then
            echo "$TAG is already published; leaving it as it is."
            exit 0
          fi
          # Lookups fail closed: only "404 Not Found" (no stable release yet) counts as "none". If
          # this stops, the release stays a draft; publish it by hand from the Releases page.
          err=$(mktemp)
          if latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>"$err"); then
            if [[ ! "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::The latest release has an unexpected tag '$latest'"
              exit 1
            fi
            newest=$(printf '%s\n%s\n' "${latest#v}" "${TAG#v}" | sort -V | tail -n1)
          elif grep -q "HTTP 404" "$err"; then
            newest=${TAG#v}
          else
            echo "::error::Couldn't read the latest release: $(cat "$err")"
            exit 1
          fi
          # A draft of an older version (rebuilt by hand after a newer release) mustn't take "Latest" back.
          if [ "$newest" = "${TAG#v}" ]; then make_latest=true; else make_latest=false; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest="$make_latest"
          echo "Published $TAG (latest: $make_latest)."
