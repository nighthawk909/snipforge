name: Preview release

# Run by hand (Actions > Preview release > Run workflow) to publish a test build for people on the
# Preview update channel. It builds and self-tests the chosen branch, tag or commit as the version
# you give (e.g. 0.6.0-preview.1) and publishes it as a GitHub *prerelease* tagged v<version>.
# Prereleases never become "Latest", so the stable download link and release-please's release PRs
# are unaffected. Stable releases still come only from merging the release-please PR.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit to build"
        type: string
        required: true
        default: main
      version:
        description: "Preview version: the next stable version plus -preview.N, e.g. 0.6.0-preview.1"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: preview-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check inputs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
      on_main: ${{ steps.check.outputs.on_main }}
    steps:
      # gh talks to github.com unless told otherwise; on GitHub Enterprise it needs this server.
      - name: Point gh at this server
        run: echo "GH_HOST=${GITHUB_SERVER_URL#https://}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ENTERPRISE_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref }}
        run: |
          # The workflow file comes from the branch it's run on; only main's reviewed copy publishes.
          # (Choose what to build with the "ref" input instead.)
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (Use workflow from: main) and pick the branch to build in 'ref'."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-preview\.[0-9]+$ ]]; then
            echo "::error::Version must look like 0.6.0-preview.1, got '$VERSION'"
            exit 1
          fi
          # Lookups fail closed: only "404 Not Found" counts as "doesn't exist".
          if latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' 2>&1); then
            stable=${latest#v}
            newest=$(printf '%s\n%s\n' "$stable" "${VERSION%%-*}" | sort -V | tail -n1)
            if [ "$newest" = "$stable" ]; then
              echo "::error::$VERSION must be ahead of the current stable release $stable (use the next version)"
              exit 1
            fi
          elif [[ "$latest" != *"HTTP 404"* ]]; then
            echo "::error::Couldn't read the latest release: $latest"
            exit 1
          fi
          tag="v$VERSION"
          if found=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" 2>&1); then
            echo "::error::Tag $tag already exists; pick the next -preview.N"
            exit 1
          elif [[ "$found" != *"HTTP 404"* ]]; then
            echo "::error::Couldn't check whether $tag exists: $found"
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          # Only a commit that's already on main is built where it can be code-signed.
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...main" --jq .status)
          case "$status" in
            ahead|identical) on_main=true ;;
            *) on_main=false
               echo "::notice::$REF isn't on main yet, so this preview is built unsigned." ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "on_main=$on_main" >> "$GITHUB_OUTPUT"

  # A branch that isn't on main yet builds unsigned, in a job that has no way to sign.
  build:
    needs: prepare
    if: ${{ needs.prepare.outputs.on_main != 'true' }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ inputs.version }}

  build-signed:
    needs: prepare
    if: ${{ needs.prepare.outputs.on_main == 'true' }}
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write  # code signing: build.yml checks the commit is on main again before checkout
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ inputs.version }}
      sign: true

  # Previews carry the Mac version too (docs/CROSS-PLATFORM.md).
  mac:
    needs: prepare
    uses: ./.github/workflows/mac.yml
    permissions:
      contents: read
    with:
      ref: ${{ needs.prepare.outputs.sha }}
      version: ${{ inputs.version }}

  publish:
    name: Publish prerelease
    needs: [prepare, build, build-signed, mac]
    if: ${{ always() && needs.prepare.result == 'success' && needs.mac.result == 'success' && (needs.build.result == 'success' || needs.build-signed.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_ENTERPRISE_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      REF: ${{ inputs.ref }}
      VERSION: ${{ inputs.version }}
    steps:
      # gh talks to github.com unless told otherwise; on GitHub Enterprise it needs this server.
      - name: Point gh at this server
        run: echo "GH_HOST=${GITHUB_SERVER_URL#https://}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snipforge-windows
          path: dist
      # The version-less SnipForge-setup.exe only serves the stable "latest" download link, so a
      # prerelease neither attaches it nor lists it in SHA256SUMS.txt.
      - name: Drop the stable-only installer copy
        run: |
          { grep -vE '  SnipForge-setup\.exe[[:space:]]*$' dist/SHA256SUMS.txt || [ $? -eq 1 ]; } > SHA256SUMS.tmp
          grep -q "  SnipForge-$VERSION-setup.exe" SHA256SUMS.tmp
          mv SHA256SUMS.tmp dist/SHA256SUMS.txt
          rm -f dist/SnipForge-setup.exe
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snipforge-macos
          path: dist-mac
      - name: Add the Mac version
        run: |
          cp "dist-mac/SnipForge-$VERSION.dmg" dist/
          (cd dist && sha256sum "SnipForge-$VERSION.dmg" >> SHA256SUMS.txt)
      - name: Build provenance
        # Artifact attestations are free for public repositories.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/SnipForge-*-setup.exe
            dist/SnipForge-*-portable.zip
            dist/SnipForge-*.dmg
      # Created as a draft with every file attached, then published, so Preview-channel users never
      # see the release before its installer and SHA256SUMS.txt are there.
      - name: Create the prerelease
        run: |
          notes="Preview build of SnipForge $VERSION from \`$REF\` ($SHA), for testing before the next stable release. The current stable release is at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest."
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --latest=false \
            --target "$SHA" --title "SnipForge $VERSION (preview)" --notes "$notes" --generate-notes \
            dist/SnipForge-*-setup.exe dist/SnipForge-*-portable.zip dist/SnipForge-*.dmg dist/SHA256SUMS.txt \
            dist/sbom.cdx.json
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
      - name: Remove the draft if publishing failed
        if: ${{ failure() }}
        run: |
          if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
      - name: Summary
        run: |
          {
            echo "### Published SnipForge $VERSION (preview)"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo
            echo "To mirror it to a SharePoint or network-share feed:"
            echo '```'
            echo "python scripts/publish_feed.py --github $TAG --target <feed folder>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
