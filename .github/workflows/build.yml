name: Build

# Builds SnipForge.exe, the installer (also copied to the version-less SnipForge-setup.exe for the
# permanent download link) and the portable zip, proves the packaged app works (--self-test), and
# writes checksums and an SBOM, uploaded as the "snipforge-windows" artifact.
# Read-only: publishing is a separate job in release.yml (stable) and preview.yml (prereleases).
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build (defaults to the triggering ref)"
        type: string
        required: false
        default: ""
      version:
        description: "Build as this version instead of the one in snipforge/__init__.py (previews, e.g. 0.6.0-preview.1)"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      version:
        description: "Optional: build as this version (e.g. 0.6.0-preview.1) to try a preview build without publishing it"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build and self-test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Ensure Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
      - name: Build
        env:
          SET_VERSION: ${{ inputs.version }}
        run: |
          $preview = if ($env:SET_VERSION) { @('--set-version', $env:SET_VERSION) } else { @() }
          python scripts/build.py --installer @preview
      - name: Self-test the packaged app
        shell: pwsh
        timeout-minutes: 5
        env:
          SET_VERSION: ${{ inputs.version }}
        run: |
          $report = "dist\selftest.json"
          $p = Start-Process -FilePath dist\SnipForge\SnipForge.exe -ArgumentList '--self-test', $report -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Packaged app self-test timed out" }
          if (Test-Path $report) { Get-Content $report }
          if ($p.ExitCode -ne 0) { throw "Packaged app failed its self-test (exit $($p.ExitCode))" }
          if ($env:SET_VERSION) {
            $reported = (Get-Content $report -Raw | ConvertFrom-Json).version
            if ($reported -ne $env:SET_VERSION) { throw "Packaged app reports $reported, expected $env:SET_VERSION" }
          }
      - name: SBOM (runtime dependencies only)
        shell: pwsh
        run: |
          python -m venv sbom-env
          sbom-env\Scripts\python -m pip install --quiet -r requirements.txt
          python -m cyclonedx_py environment sbom-env\Scripts\python.exe --output-format JSON --output-file dist\sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snipforge-windows
          path: |
            dist/SnipForge-*-setup.exe
            dist/SnipForge-setup.exe
            dist/SnipForge-*-portable.zip
            dist/SHA256SUMS.txt
            dist/sbom.cdx.json
            dist/selftest.json
          if-no-files-found: error
